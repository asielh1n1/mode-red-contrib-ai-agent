<script type="text/javascript">
    (function () {
        'use strict';

        const NAME_PATTERN = /^[a-z][a-z0-9_]{0,63}$/;
        const PARAM_PATTERN = /^[A-Za-z_][A-Za-z0-9_]*$/;

        // Providers only accept snake_case tool names. The user writes a human name and this
        // turns it into the name the model reads; accents are folded instead of dropped.
        function toToolName(value, fallback) {
            const folded = String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');
            let name = folded
                .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
                .split(/[^A-Za-z0-9]+/)
                .filter(Boolean)
                .join('_')
                .toLowerCase();
            if (!/^[a-z]/.test(name) && name) {
                name = (fallback + '_' + name).replace(/[^a-z0-9_]/g, '');
            }
            return name.slice(0, 64) || fallback;
        }
        const TYPES = [
            { value: 'string', label: 'text' },
            { value: 'number', label: 'number' },
            { value: 'integer', label: 'whole number' },
            { value: 'boolean', label: 'true / false' },
            { value: 'array', label: 'list' },
            { value: 'object', label: 'object' }
        ];

        // The dialog edits a list of parameters; the stored value stays a JSON Schema so
        // the runtime (and any flow exported to another Node-RED) keeps working as before.
        function schemaToParams(schema) {
            if (!schema || typeof schema !== 'object') {
                return [];
            }
            const properties = schema.properties || {};
            const required = Array.isArray(schema.required) ? schema.required : [];
            return Object.keys(properties).map(function (name) {
                const property = properties[name] || {};
                const type = Array.isArray(property.type) ? property.type[0] : property.type || 'string';
                return {
                    name: name,
                    type: TYPES.some(function (entry) { return entry.value === type; }) ? type : 'string',
                    required: required.indexOf(name) !== -1,
                    description: property.description || ''
                };
            });
        }

        function paramsToSchema(params) {
            const properties = {};
            const required = [];
            params.forEach(function (param) {
                const property = { type: param.type };
                if (param.description) {
                    property.description = param.description;
                }
                if (param.type === 'array') {
                    property.items = { type: 'string' };
                }
                properties[param.name] = property;
                if (param.required) {
                    required.push(param.name);
                }
            });
            const schema = { type: 'object', properties: properties };
            if (required.length) {
                schema.required = required;
            }
            return schema;
        }

        RED.nodes.registerType('ai-tool', {
            category: 'ai agents',
            color: '#aed581',
            defaults: {
                name: { value: '', required: true },
                toolName: { value: '' },
                description: { value: '', required: true },
                parameters: { value: '' }
            },
            inputs: 1,
            outputs: 1,
            icon: 'subflow.svg',
            paletteLabel: 'tool',
            inputLabels: 'tool call',
            // The result must be wired back into this input: the label says so on the node itself.
            outputLabels: 'run tool flow, then wire back here',
            label: function () {
                return this.name || 'tool';
            },
            labelStyle: function () {
                return this.name ? 'node_label_italic' : '';
            },
            oneditprepare: function () {
                let params = [];
                try {
                    params = schemaToParams(this.parameters ? JSON.parse(this.parameters) : null);
                } catch (error) {
                    params = [];
                }
                const $list = $('#ai-agent-tool-params');
                const node = this;

                // The technical name follows the human one until the user edits it by hand.
                const $name = $('#node-input-name');
                const $toolName = $('#node-input-toolName');
                let nameEdited = false;
                // A value saved by an older dialog (or typed as a human name) is normalised here.
                if (!NAME_PATTERN.test(String($toolName.val() || '').trim())) {
                    $toolName.val(toToolName($toolName.val() || $name.val(), 'tool'));
                }
                $name.on('input', function () {
                    if (!nameEdited) {
                        $toolName.val(toToolName($name.val(), 'tool'));
                    }
                });
                $toolName.on('input', function () {
                    nameEdited = true;
                });

                function render() {
                    $list.empty();
                    if (!params.length) {
                        $list.append('<li class="ai-agent-tool-params-empty">No parameters. The model will call this tool with an empty object.</li>');
                    }
                    params.forEach(function (param, index) {
                        const $row = $('<li class="ai-agent-tool-param-row"></li>');
                        const $name = $('<input type="text" class="ai-agent-tool-param-name" placeholder="city">')
                            .val(param.name)
                            .on('input', function () { param.name = $(this).val().trim(); });
                        const $type = $('<select class="ai-agent-tool-param-type"></select>');
                        TYPES.forEach(function (entry) {
                            $type.append($('<option></option>').val(entry.value).text(entry.label));
                        });
                        $type.val(param.type).on('change', function () { param.type = $(this).val(); });
                        const $required = $('<input type="checkbox" style="width: 20px!important;">').prop('checked', param.required)
                            .on('change', function () { param.required = $(this).prop('checked'); });
                        const $description = $('<input type="text" class="ai-agent-tool-param-desc" placeholder="What this value means">')
                            .val(param.description)
                            .on('input', function () { param.description = $(this).val(); });
                        const $remove = $('<button type="button" class="red-ui-button red-ui-button-small" title="Remove parameter"><i class="fa fa-trash"></i></button>')
                            .on('click', function () {
                                params.splice(index, 1);
                                render();
                            });
                        $row.append(
                            $('<div class="ai-agent-tool-param-fields"></div>').append(
                                $('<div><label>Name</label></div>').append($name),
                                $('<div><label>Type</label></div>').append($type),
                                $('<div class="ai-agent-tool-param-desc-row"><label>Description</label></div>').append($description)
                            ),
                            $('<div class="ai-agent-tool-param-head"></div>').append(
                                $('<label class="ai-agent-tool-param-required"></label>').append($required, ' required'),
                                $remove
                            )
                        );
                        $list.append($row);
                    });
                    node._aiToolParams = params;
                    const summary = $('#ai-agent-tool-params-summary');
                    summary.text(params.length ? params.length + ' parameter' + (params.length === 1 ? '' : 's') : '');
                }

                $('#ai-agent-tool-add-param').on('click', function () {
                    params.push({ name: '', type: 'string', required: false, description: '' });
                    render();
                    $list.find('.ai-agent-tool-param-name').last().trigger('focus');
                });

                this._aiToolParams = params;
                render();
            },
            oneditsave: function () {
                const params = this._aiToolParams || [];
                const names = {};
                for (let index = 0; index < params.length; index += 1) {
                    const param = params[index];
                    if (!PARAM_PATTERN.test(String(param.name || ''))) {
                        RED.notify('Parameter ' + (index + 1) + ': use a name starting with a letter or underscore', 'error');
                        return false;
                    }
                    if (names[param.name]) {
                        RED.notify('Duplicate parameter name: ' + param.name, 'error');
                        return false;
                    }
                    names[param.name] = true;
                }
                this.parameters = JSON.stringify(paramsToSchema(params));
                // The name the model sees always ends up being a valid tool name.
                const typed = String($('#node-input-toolName').val() || '').trim();
                this.toolName = NAME_PATTERN.test(typed) ? typed : toToolName(typed || this.name, 'tool');
            }
        });

    }());
</script>

<style>
    .ai-agent-tool-params-list { list-style: none; margin: 0!important; padding: 0; overflow-y: auto; }
    .ai-agent-tool-param-row { border: 1px solid #d9d9d9; border-radius: 3px; padding: 6px 8px; margin-bottom: 6px; background: #fafafa; }
    .ai-agent-tool-param-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .ai-agent-tool-param-required { font-weight: normal; font-size: 12px; color: #666;width: 200px; padding-top: 5px;}
    .ai-agent-tool-param-fields { display: grid; grid-template-columns: 1fr 150px; gap: 6px; }
    .ai-agent-tool-param-fields label { font-weight: normal; font-size: 11px; color: #888; }
    .ai-agent-tool-param-fields input[type=text], .ai-agent-tool-param-fields select { width: 100%; }
    .ai-agent-tool-param-desc-row, .ai-agent-tool-param-desc-row + input { grid-column: 1 / span 2; }
    .ai-agent-tool-param-desc { width: 100%; }
    .ai-agent-tool-params-empty { padding: 8px; color: #888; }


    /* The help icon sits inside the label, right after its text, like the field icon. */
    .form-row label .ai-agent-help {
        position: relative;
        display: inline-block;
        margin-left: 4px;
        color: #999;
        cursor: help;
        font-weight: normal;
    }
    .form-row label .ai-agent-help:hover { color: #4fc3f7; }

    /* The tooltip is painted outside the dialog box: no horizontal scrollbar, nothing clipped by
       the form borders. 280px is the room the dialog leaves on both sides of a label. */
    .form-row label .ai-agent-help::after {
        content: attr(data-help);
        position: absolute;
        left: 0;
        top: 100%;
        margin-top: 4px;
        z-index: 100000;
        display: block;
        width: 280px;
        max-width: 280px;
        padding: 8px 10px;
        border-radius: 3px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        background: #333;
        color: #fff;
        font-size: 12px;
        font-weight: normal;
        line-height: 1.45;
        white-space: normal;
        word-wrap: break-word;
        text-align: left;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.12s ease-in;
        pointer-events: none;
    }
    .form-row label .ai-agent-help:hover::after { opacity: 1; visibility: visible; }
</style>

<script type="text/html" data-template-name="ai-tool">
    <div class="form-row">
        <label for="node-input-name" class="w100"><i class="fa fa-tag"></i> Node Name<span class="ai-agent-help" data-help="Any readable name, in any language: Get weather, Consultar clima. It is only the label of the node in the flow, so spaces and accents are fine."><i class="fa fa-question-circle"></i></span></label>
        <input type="text" id="node-input-name" placeholder="Get weather" class="w100">
    </div>
    <div class="form-row">
        <label for="node-input-toolName" class="w100"><i class="fa fa-code"></i> Tool name<span class="ai-agent-help" data-help="The name the model reads. Write it in natural language and it is converted to snake_case (Get weather becomes get_weather). You can also type the technical name yourself. Letters, digits and underscores, up to 64 characters, starting with a letter."><i class="fa fa-question-circle"></i></span></label>
        <input type="text" id="node-input-toolName" placeholder="get_weather" class="w100">
    </div>
    <div class="form-row" style="margin-top: 10px;">
        <label for="node-input-description" class="w100"><i class="fa fa-info-circle"></i> Description<span class="ai-agent-help" data-help="What the tool does and when to use it. It is the only thing the model sees before deciding to call the tool, so be concrete: Returns the current weather for a city, not Weather tool."><i class="fa fa-question-circle"></i></span></label>
        <input type="text" id="node-input-description" placeholder="Returns the current weather for a city" class="w100">
    </div>
    <div class="form-row">
        <label class="w100"><i class="fa fa-list-ul"></i> Parameters <span class="ai-agent-help" data-help="The arguments the model must provide, with their type and description. They arrive in msg.payload as an object, already validated, so the flow can read msg.payload.city. Mark a parameter required only when the tool cannot work without it."><i class="fa fa-question-circle"></i></span><span id="ai-agent-tool-params-summary" style="font-weight: normal; color: #888; margin-left: 6px;"></span></label>
        <ul class="ai-agent-tool-params-list" id="ai-agent-tool-params"></ul>
        <button type="button" class="red-ui-button red-ui-button-small" id="ai-agent-tool-add-param"><i class="fa fa-plus"></i> Add parameter</button>
    </div>
</script>

<script type="text/html" data-help-name="ai-tool">
    <p>Defines a capability of the agent and runs it as a Node-RED flow.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>When the agent calls the tool, the arguments chosen by the model (validated against the parameters). Otherwise, a normal message to test the flow by hand.</dd>
        <dt>(any property) <span class="property-type">any</span></dt>
        <dd>The call is a copy of the message that entered the Agent, so any property it carried (<code>msg.user</code>, a token, a topic...) is here, together with <code>_msgid</code>, <code>_user</code> and <code>session_id</code>. Only <code>payload</code> is different: it holds the arguments of this call.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">message</span></dt>
        <dd>Passes the message to the tool flow unchanged.</dd>
    </dl>

    <h3>Wiring</h3>
    <p>Wire the output to the nodes that do the work, and wire the last node <b>back into this Tool's input</b> (or into a <b>Tool Return</b> node wired the same way). A Tool that is never wired back leaves the agent waiting and the node stuck in <b>running</b>.</p>

    <h3>Errors</h3>
    <p>Best practice: <b>catch the error before the Tool Return</b> and return a clear message to the model, for example <i>"The weather service is unavailable right now"</i>. A tool that fails and never answers leaves a tool call without a result in the conversation memory; the next message of the same session is then rejected by the provider (<i>"An assistant message with 'tool_calls' must be followed by tool messages"</i>) until the session is cleared.</p>
    <p>The simplest way is to put a <b>Catch</b> node on the tool flow (scope: this Tool and the nodes of its flow) and connect it to the <b>Tool Return</b>, returning a property such as <code>error.message</code>. The error reaches the model as the tool result, so it can explain the problem or try another call instead of the flow failing.</p>

    <h3>Details</h3>
    <p><b>Name</b> and <b>Description</b> are the tool definition the model reads. Add one row per <b>parameter</b> (name, type, required, description); the node stores them as a JSON Schema and validates the arguments before the flow runs, reporting invalid ones to the model.</p>
    <p>The Tool node starts its flow when the agent calls it and ends it when the flow reaches it again (returning <code>msg.payload</code>). A <b>Tool Return</b> node can be used instead when the result lives in another property.</p>
    <p>Any node can sit in between: HTTP Request, MQTT, PostgreSQL, Function, home automation, and so on.</p>
    <p>Each call is its own copy of the Agent's input message, so a tool can add properties and read them later in its flow without changing the other tools of the same turn nor the answer. The copy is shallow: writing inside a nested object (<code>msg.user.id</code>) does change the object shared with the Agent's message.</p>
    <p>If a run is cancelled before the tool answers (agent timeout, redeploy), the agent closes the call with a "cancelled" result the next time the session is used, so the conversation stays valid.</p>
</script>
