<script type="text/javascript">
    (function () {
        'use strict';

        RED.nodes.registerType('ai-tool-return', {
            category: 'ai agents',
            color: '#aed581',
            defaults: {
                name: { value: '' },
                returnProperty: { value: 'payload' }
            },
            inputs: 1,
            outputs: 0,
            icon: 'font-awesome/fa-reply',
            paletteLabel: 'tool return',
            inputLabels: 'tool result',
            label: function () {
                return this.name || 'tool return';
            },
            labelStyle: function () {
                return this.name ? 'node_label_italic' : '';
            }
        });
    }());
</script>

<script type="text/html" data-template-name="ai-tool-return">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Result">
    </div>
    <div class="form-row">
        <label for="node-input-returnProperty"><i class="fa fa-reply"></i> Result property</label>
        <input type="text" id="node-input-returnProperty" placeholder="payload">
    </div>
    <div class="form-tips">Dot notation is allowed, for example <code>payload.data</code>. Strings and objects are passed to the agent as-is.</div>
</script>

<script type="text/html" data-help-name="ai-tool-return">
    <p>Returns the result of a tool flow to the agent that called it.</p>

    <h3>Details</h3>
    <p>Place it at the end of every Tool flow. The node resolves the pending tool call in place and the agent continues its reasoning with the result, so no extra wiring back to the Agent is needed.</p>
    <p>The <b>Result property</b> selects the value to return (for example <code>payload</code> or <code>payload.data</code>). Arrays and objects are serialized for the model.</p>
    <p>If the agent already timed out or the call was resolved twice, the node shows a short notification instead of failing the flow.</p>
    <p>The status badge confirms the call for a moment and is then removed.</p>
</script>
